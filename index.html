<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAHA ART | Official Portfolio</title>
<meta name="description" content="TAHA ART - Professional Graphic Design Portfolio">
<meta name="theme-color" content="#050806">

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

:root{
 --bg:#050806;
 --green:#087a43;
 --light:#18d477;
 --white:#f5fff8;
 --muted:#8b9c91;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
 background:var(--bg);
 color:var(--white);
 font-family:'Vazirmatn',sans-serif;
 overflow-x:hidden;
}

body:before{
 content:"";
 position:fixed;
 width:600px;
 height:600px;
 background:radial-gradient(circle,#087a4325,transparent 70%);
 top:-250px;
 left:-200px;
 pointer-events:none;
 z-index:-1;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:25px 8%;
 border-bottom:1px solid #ffffff12;
}

.logo{
 font-size:25px;
 font-weight:800;
 letter-spacing:3px;
 cursor:pointer;
}

.logo span{color:var(--light)}

.signature{
 font-size:11px;
 color:var(--muted);
}

.hero{
 min-height:80vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 padding:50px 20px;
}

.hero h1{
 font-family:Georgia,serif;
 font-size:clamp(55px,12vw,115px);
 letter-spacing:5px;
 animation:appear 1.2s ease;
}

.hero h1 span{
 color:var(--light);
}

.line{
 width:90px;
 height:3px;
 background:var(--light);
 margin:25px auto;
 box-shadow:0 0 20px var(--light);
}

.hero p{
 color:#a4b5a9;
 font-size:14px;
 letter-spacing:2px;
}

.buttons{
 display:flex;
 gap:15px;
 margin-top:45px;
 flex-wrap:wrap;
 justify-content:center;
}

.btn{
 border:1px solid var(--green);
 padding:15px 38px;
 background:transparent;
 color:white;
 text-decoration:none;
 font-family:inherit;
 cursor:pointer;
 transition:.35s;
 font-size:14px;
}

.btn.primary{
 background:var(--green);
}

.btn:hover{
 background:var(--light);
 color:#001b0c;
 transform:translateY(-5px);
 box-shadow:0 10px 35px #087a4350;
}

footer{
 border-top:1px solid #ffffff12;
 padding:25px;
 text-align:center;
 color:#66766c;
 font-size:11px;
}

footer span{color:var(--light)}

.page{
 display:none;
 min-height:80vh;
 padding:55px 7%;
 animation:appear .5s ease;
}

.page.active{display:block}

.page-title{
 font-size:35px;
 margin-bottom:10px;
}

.page-sub{
 color:var(--muted);
 font-size:13px;
 margin-bottom:35px;
}

.back{
 display:inline-block;
 color:var(--light);
 cursor:pointer;
 margin-bottom:35px;
 font-size:13px;
}

.categories{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-bottom:30px;
}

.cat{
 background:#0b1510;
 border:1px solid #ffffff16;
 color:white;
 padding:10px 19px;
 cursor:pointer;
 font-family:inherit;
 font-size:12px;
}

.cat.active,.cat:hover{
 background:var(--green);
 border-color:var(--light);
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
 gap:22px;
}

.card{
 background:#0b110d;
 border:1px solid #ffffff12;
 overflow:hidden;
 transition:.35s;
}

.card:hover{
 transform:translateY(-7px);
 border-color:var(--green);
}

.card img{
 width:100%;
 aspect-ratio:4/5;
 object-fit:cover;
 display:block;
}

.card-info{padding:17px}

.card-info h3{
 font-size:15px;
 margin-bottom:8px;
}

.card-info p{
 color:var(--muted);
 font-size:12px;
 line-height:2;
}

.contact-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
 gap:18px;
}

.contact-box{
 padding:30px;
 background:#0b110d;
 border:1px solid #ffffff15;
 text-align:center;
 transition:.3s;
}

.contact-box:hover{
 border-color:var(--light);
 transform:translateY(-5px);
}

.contact-box h3{
 margin-bottom:15px;
}

.contact-box a{
 color:var(--light);
 text-decoration:none;
 font-size:13px;
}

.admin-panel{
 max-width:650px;
 margin:auto;
 background:#0b110d;
 border:1px solid #ffffff18;
 padding:30px;
}

input,textarea,select{
 width:100%;
 padding:14px;
 margin:9px 0;
 background:#050806;
 border:1px solid #ffffff20;
 color:white;
 font-family:inherit;
 outline:none;
}

input:focus,textarea:focus,select:focus{
 border-color:var(--light);
}

textarea{min-height:100px}

.admin-panel h2{margin-bottom:20px}

.admin-list{
 margin-top:30px;
}

.admin-item{
 padding:12px;
 border:1px solid #ffffff17;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:10px;
 font-size:12px;
}

.delete{
 background:#8b1b1b;
 color:white;
 border:0;
 padding:8px 12px;
 cursor:pointer;
}

.status{
 font-size:12px;
 color:var(--light);
 margin-top:15px;
}

@keyframes appear{
 from{opacity:0;transform:translateY(25px)}
 to{opacity:1;transform:translateY(0)}
}

@media(max-width:600px){
 header{padding:20px}
 .hero{min-height:75vh}
 .page{padding:35px 20px}
 .admin-panel{padding:20px}
}
</style>
</head>

<body>

<header>
 <div class="logo" id="logo">TAHA<span>ART</span></div>
 <div class="signature">TahaFazli</div>
</header>

<main>

<section class="hero" id="home">
 <h1>TAHA<span>ART</span></h1>
 <div class="line"></div>
 <p>DESIGN DIFFERENT. BE DIFFERENT.</p>

 <div class="buttons">
  <button class="btn primary" onclick="showPage('contact')">
   ارتباط
  </button>

  <button class="btn" onclick="showPage('portfolio')">
   دیدن نمونه‌کار
  </button>
 </div>
</section>

<section class="page" id="contact">
 <div class="back" onclick="showPage('home')">← بازگشت</div>
 <h2 class="page-title">ارتباط با من</h2>
 <p class="page-sub">راه‌های ارتباطی TAHA ART</p>

 <div class="contact-grid">

  <div class="contact-box">
   <h3>Instagram</h3>
   <a href="https://instagram.com/tahaart_ir18" target="_blank">
    @tahaart_ir18
   </a>
  </div>

  <div class="contact-box">
   <h3>Telegram</h3>
   <a href="https://t.me/TahaArt7" target="_blank">
    @TahaArt7
   </a>
  </div>

  <div class="contact-box">
   <h3>Rubika</h3>
   <a href="https://rubika.ir/TAHAART_IR" target="_blank">
    @TAHAART_IR
   </a>
  </div>

 </div>
</section>

<section class="page" id="portfolio">
 <div class="back" onclick="showPage('home')">← بازگشت</div>
 <h2 class="page-title">PORTFOLIO</h2>
 <p class="page-sub">Selected works by TahaArt</p>

 <div class="categories">
  <button class="cat active" onclick="filterDesigns('ALL',this)">ALL</button>
  <button class="cat" onclick="filterDesigns('NASAJI',this)">NASA​​JI</button>
  <button class="cat" onclick="filterDesigns('SHAHIN',this)">SHAHIN</button>
  <button class="cat" onclick="filterDesigns('PERSONAL',this)">PERSONAL</button>
  <button class="cat" onclick="filterDesigns('OTHER',this)">OTHER</button>
 </div>

 <div class="grid" id="designGrid"></div>
 <p class="status" id="portfolioStatus"></p>
</section>

<section class="page" id="admin">
 <div class="back" onclick="showPage('home')">← خروج</div>

 <div class="admin-panel">
  <h2>TAHA ART ADMIN</h2>

  <input id="designTitle" placeholder="عنوان طرح">

  <textarea id="designCaption" placeholder="توضیحات طرح"></textarea>

  <select id="designCategory">
   <option value="NASA​​JI">NASAJI</option>
   <option value="SHAHIN">SHAHIN</option>
   <option value="PERSONAL">PERSONAL</option>
   <option value="OTHER">OTHER</option>
  </select>

  <input type="file" id="designImage" accept="image/*">

  <button class="btn primary" style="width:100%" onclick="uploadDesign()">
   انتشار نمونه‌کار
  </button>

  <p class="status" id="adminStatus"></p>

  <div class="admin-list" id="adminList"></div>
 </div>
</section>

</main>

<footer>
© 2026 <span>TAHA ART</span> — All Rights Reserved
</footer>

<script>

const API = "https://script.google.com/macros/s/AKfycbz-n9CUD7wOrfb5GCUfTlQ48RtVUs3c2ACgTpuot39h-acaJxLodZs-uMhTORRSEbaL/exec";

let designs = [];
let currentCategory = "ALL";
let adminPassword = "";
let logoClicks = 0;

function showPage(id){
 document.querySelectorAll('.page,.hero').forEach(p=>{
  p.style.display='none';
  p.classList.remove('active');
 });

 const page=document.getElementById(id);
 page.style.display='block';

 if(id!=='home') page.classList.add('active');

 if(id==='portfolio') loadDesigns();
 if(id==='admin') renderAdmin();
 window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('logo').addEventListener('click',()=>{
 logoClicks++;

 if(logoClicks>=57){
  logoClicks=0;
  adminLogin();
 }
});

function adminLogin(){
 const pass=prompt("TAHA ART ADMIN PASSWORD:");

 if(!pass)return;

 adminPassword=pass;
 showPage('admin');
}

function loadDesigns(){

 document.getElementById('portfolioStatus').textContent='در حال دریافت نمونه‌کارها...';

 const callback='tahaCallback_'+Date.now();

 window[callback]=function(data){
  designs=Array.isArray(data)?data:[];
  renderDesigns();
  document.getElementById('portfolioStatus').textContent=
   designs.length ? '' : 'هنوز نمونه‌کاری منتشر نشده است.';

  delete window[callback];
  script.remove();
 };

 const script=document.createElement('script');

 script.src=API+'?action=list&callback='+callback;

 script.onerror=()=>{
  document.getElementById('portfolioStatus').textContent='خطا در دریافت اطلاعات.';
 };

 document.body.appendChild(script);
}

function filterDesigns(category,button){

 currentCategory=category;

 document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));

 button.classList.add('active');

 renderDesigns();
}

function renderDesigns(){

 const grid=document.getElementById('designGrid');

 const filtered=designs.filter(d=>
  currentCategory==='ALL' || d.category===currentCategory
 );

 grid.innerHTML='';

 filtered.forEach(d=>{

  const card=document.createElement('div');
  card.className='card';

  const img=document.createElement('img');
  img.src=d.image;
  img.alt=d.title||'TAHA ART Design';
  img.loading='lazy';

  const info=document.createElement('div');
  info.className='card-info';

  const title=document.createElement('h3');
  title.textContent=d.title||d.category;

  const caption=document.createElement('p');
  caption.textContent=d.caption||'';

  info.append(title,caption);
  card.append(img,info);
  grid.appendChild(card);
 });
}

function renderAdmin(){

 const list=document.getElementById('adminList');

 list.innerHTML='';

 designs.forEach(d=>{

  const item=document.createElement('div');
  item.className='admin-item';

  const title=document.createElement('span');
  title.textContent=d.title||d.category;

  const btn=document.createElement('button');
  btn.className='delete';
  btn.textContent='حذف';

  btn.onclick=()=>deleteDesign(d.id);

  item.append(title,btn);
  list.appendChild(item);
 });
}

async function compressImage(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=e=>{

   const img=new Image();

   img.onload=()=>{

    const canvas=document.createElement('canvas');

    const max=1600;
    const scale=Math.min(1,max/Math.max(img.width,img.height));

    canvas.width=Math.round(img.width*scale);
    canvas.height=Math.round(img.height*scale);

    canvas.getContext('2d').drawImage(
     img,0,0,canvas.width,canvas.height
    );

    resolve(canvas.toDataURL('image/jpeg',0.82));
   };

   img.onerror=reject;
   img.src=e.target.result;
  };

  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function postData(data){

 const response=await fetch(API,{
  method:'POST',
  headers:{
   'Content-Type':'text/plain;charset=utf-8'
  },
  body:JSON.stringify(data)
 });

 return await response.json();
}

async function uploadDesign(){

 const status=document.getElementById('adminStatus');

 const file=document.getElementById('designImage').files[0];

 if(!file){
  status.textContent='ابتدا تصویر را انتخاب کن.';
  return;
 }

 if(file.size>12*1024*1024){
  status.textContent='حجم تصویر باید کمتر از ۱۲ مگابایت باشد.';
  return;
 }

 status.textContent='در حال آماده‌سازی تصویر...';

 try{

  const image=await compressImage(file);

  status.textContent='در حال انتشار...';

  const result=await postData({

   action:'add',
   password:adminPassword,
   title:document.getElementById('designTitle').value,
   caption:document.getElementById('designCaption').value,
   category:document.getElementById('designCategory').value,
   image:image

  });

  if(!result.success){
   status.textContent=result.message||'خطا در انتشار';
   return;
  }

  status.textContent='نمونه‌کار با موفقیت منتشر شد!';

  document.getElementById('designTitle').value='';
  document.getElementById('designCaption').value='';
  document.getElementById('designImage').value='';

  loadDesigns();

 }catch(e){

  status.textContent='خطا در اتصال. تنظیمات انتشار و دسترسی سرور را بررسی کن.';

 }
}

async function deleteDesign(id){

 if(!confirm('این نمونه‌کار حذف شود؟'))return;

 const status=document.getElementById('adminStatus');

 status.textContent='در حال حذف...';

 try{

  const result=await postData({
   action:'delete',
   password:adminPassword,
   id:id
  });

  if(result.success){
   status.textContent='نمونه‌کار حذف شد.';
   loadDesigns();
  }else{
   status.textContent=result.message;
  }

 }catch(e){

  status.textContent='خطا در حذف نمونه‌کار.';

 }
}

</script>

</body>
  </html>
